events {}

http {
    upstream failsafe_api {
        server failsafe-api:5171;
    }

    upstream failsafe_web {
        server failsafe-web:5056;
    }

    server {
        listen 80;

        # Routes API and Swagger traffic to the API container.
        location /api/ {
            proxy_pass http://failsafe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger/ {
            proxy_pass http://failsafe_api;
            proxy_set_header Host $host;
        }

        # Everything else goes to Blazor Server. The Upgrade/Connection
        # headers here are NOT optional — Blazor Server's interactivity
        # runs over a persistent SignalR WebSocket connection. Without
        # these two lines, Nginx would treat every request as a normal
        # HTTP request and silently break all interactivity (buttons,
        # live updates) while the static page shell still loads fine,
        # making the failure look confusing rather than obvious.
        location / {
            proxy_pass http://failsafe_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}