# Deployment-focused Compose file — this is what actually runs on EC2.
# Unlike docker-compose.yml (local dev, infra-only), this containerizes
# EVERYTHING, since there's no hot-reload need on a deployed server.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}" # from environment, never hardcoded here
    volumes:
      - failsafe-sql-data:/var/opt/mssql

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    volumes:
      - failsafe-keycloak-data:/opt/keycloak/data

  failsafe-api:
    build:
      context: .
      dockerfile: src/Failsafe.API/Dockerfile
    environment:
      ConnectionStrings__FailsafeDb: "Server=sqlserver;Database=FailsafeDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      - sqlserver
      - keycloak

  failsafe-web:
    build:
      context: .
      dockerfile: src/Failsafe.Web/Dockerfile
    depends_on:
      - failsafe-api

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - failsafe-api
      - failsafe-web

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - failsafe-api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    volumes:
      - failsafe-grafana-data:/var/lib/grafana

volumes:
  failsafe-sql-data:
  failsafe-keycloak-data:
  failsafe-grafana-data: